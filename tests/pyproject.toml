
[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "tests"
version = "4.0.0"
description = "Checks for PDFs."
authors = [{ name = "Alex Povel", email = "alex.povel@tuhh.de" }]
requires-python = ">= 3.10, <4.0"
dependencies = [
    "pymupdf~=1.27.0",
    "pytest~=7.4.0",
    "PyYAML~=6.0.0",
    "python-dateutil~=2.8.0",
    "PaperSize~=1.7.0",
]
optional-dependencies = { dev = ["ipython~=8.14", "black~=26.3"] }
